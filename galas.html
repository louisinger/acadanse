<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galas et festivals — Aca Danse</title>
  <meta name="description" content="Les galas et festivals d’Aca Danse : spectacles, émotions et passion de la danse.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,700;9..144,900&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="galas" class="light">
  <main id="main" class="page galas">
    <div class="wrap">
      <h1>Nos Galas</h1>
    </div>
    <div class="carousel coverflow" aria-label="Nos galas">
      <button class="arrow" type="button" data-dir="-1" aria-label="Gala précédent">‹</button>
      <div class="track">
        <figure class="gala"><img src="assets/img/gala-2024.webp" alt="Gala 2024"><figcaption><span>Gala</span><strong>2024</strong></figcaption></figure>
        <figure class="gala"><img src="assets/img/gala-2026.webp" alt="Gala 2026"><figcaption><span>Gala</span><strong>2026</strong></figcaption></figure>
        <figure class="gala"><img src="assets/img/gala-2028.webp" alt="Gala 2028"><figcaption><span>Gala</span><strong>2028</strong></figcaption></figure>
      </div>
      <button class="arrow" type="button" data-dir="1" aria-label="Gala suivant">›</button>
      <div class="dots"></div>
    </div>

    <section class="festivals" id="festivals" aria-labelledby="h-festivals">
      <img src="assets/img/home-festivals.webp" alt="" loading="lazy">
      <div class="festivals-content reveal">
        <h2 id="h-festivals" class="ruled">Nos Festivals</h2>
        <p class="sub">Danses du monde, couleurs et partage : retrouvez <em>Aca’Danse</em> sur les scènes et festivals de la région. Les prochaines dates sont annoncées sur nos réseaux.</p>
        <p class="split-ctas">
          <a class="btn" href="https://www.instagram.com/explore/tags/acadanse57/" target="_blank" rel="noopener">Instagram</a>
          <a class="btn" href="https://www.facebook.com/search/top?q=Aca%20Danse%20Gu%C3%A9nange" target="_blank" rel="noopener">Facebook</a>
        </p>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
